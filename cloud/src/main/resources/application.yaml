spring:
  application:
    name: cloud
  datasource:
    url: jdbc:postgresql://${DB_HOST:101.43.233.17}:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

hoopshake:
  jwt:
    secret: ${JWT_SECRET:hoopshake-basketball-coach-agent-system-for-beijing-university-of-posts-and-telecommunications}
  ingest:
    service-token: ${INGEST_SERVICE_TOKEN:hoopshake-local-ingest-token}
  register:
    enabled: true
    invite-code: ${REGISTER_INVITE_CODE:hoopshake-invite}
  cloud:
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
      path-patterns:
        - /api/**
      allow-credentials: true
      max-age-seconds: 3600
  student:
    initial-password: ${HOOPSHAKE_STUDENT_INIT_PWD:}

  # ============ 云端 Agent 系统(见 docs/agent/)============
  # 默认关闭:开发机无 GLM key 也能启动,对话端点降级 50310,训练数据端点不受影响。
  agent:
    enabled: ${HOOPSHAKE_AGENT_ENABLED:false}
    # 型号为占位,以账号实际可用型号为准
    tier:
      fast: ${GLM_TIER_FAST:glm-4-flash}
      standard: ${GLM_TIER_STANDARD:glm-4-air}
      advanced: ${GLM_TIER_ADVANCED:glm-4-plus}
    chunk:
      max-tokens: 450
      overlap-tokens: 40
      min-chunk-chars: 120
    rag:
      top-k: 4
      similarity-threshold: 0.5
      max-injected-open: 2
      max-injected-structured: 4

