spring:
  application:
    name: cloud
  datasource:
    url: jdbc:postgresql://${DB_HOST:101.43.233.17}:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  ai:
    openai:
      api-key: ${ZHIPUAI_API_KEY}
      base-url: https://open.bigmodel.cn/api/paas/v4
      chat:
        model: glm-5.2
        timeout: 5m
      embedding:
        model: embedding-3
        dimensions: 1024
        timeout: 60s
    vectorstore:
      pgvector:
        dimensions: 1024
        distance-type: COSINE_DISTANCE

hoopshake:
  jwt:
    secret: ${JWT_SECRET:hoopshake-basketball-coach-agent-system-for-beijing-university-of-posts-and-telecommunications}
  ingest:
    service-token: ${INGEST_SERVICE_TOKEN:hoopshake-local-ingest-token}
  register:
    enabled: true
    invite-code: ${REGISTER_INVITE_CODE:hoopshake-invite}
  cloud:
    cors:
      allowed-origins:
        - https://*.cnsportiot.com
        - http://localhost:5173
        - http://127.0.0.1:5173
      path-patterns:
        - /api/**
      allow-credentials: true
      max-age-seconds: 3600
  student:
    initial-password: ${INITIAL_PASSWORD:}
  agent:
    enabled: ${HOOPSHAKE_AGENT_ENABLED:true}    # 关闭时不装配 LLM/向量,对话端点降级 50310
    max-retries: ${GLM_MAX_RETRIES:2}            # 瞬时错误(超时/5xx/429)同模型重试次数(降级链第①层)
    tiers:
      fast:                                      # 意图分类 / RAG query 改写 / 标题 / 建议追问
        model: ${GLM_TIER_FAST:glm-5.2}
        reasoning: off
      standard:                                  # 学生对话主回答(锚定训练)
        model: ${GLM_TIER_STANDARD:glm-5.2}
        reasoning: high
      advanced:                                  # 备课 / Reflection 评估 / 损伤·复杂升档
        model: ${GLM_TIER_ADVANCED:glm-5.2}
        reasoning: max
    fallback:                                    # 主调用故障时的跨模型兜底(降级链第②层)
      model: ${GLM_FALLBACK_MODEL:glm-5-turbo}
      reasoning: off
    chunk:                                       # 切分(8.3)
      max-tokens: 450
      overlap-tokens: 40
      min-chunk-chars: 120
    rag:                                         # 召回(8.5)
      top-k: 4
      similarity-threshold: 0.5
      max-injected-open: 2
      max-injected-structured: 4
